services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/power_paleontology
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6334
    depends_on:
      - postgres
      - redis
      - qdrant

  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/power_paleontology
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6334
    depends_on:
      - postgres
      - redis
      - qdrant

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: power_paleontology
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
