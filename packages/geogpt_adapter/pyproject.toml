[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerpaleontology-geogpt-adapter"
version = "0.1.0"
description = "GeoGPT adapter for PowerPaleontology"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
